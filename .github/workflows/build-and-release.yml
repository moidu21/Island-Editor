name: Build and publish a release

# Ce workflow ne possède volontairement aucun déclencheur automatique.
# Il ne peut être lancé que depuis Actions > Build and publish a release > Run workflow.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la Release (exemple : v46.19)"
        required: true
        type: string
      release_name:
        description: "Nom affiché (vide = Anno1800IslandTool + tag)"
        required: false
        default: ""
        type: string
      release_notes:
        description: "Notes de version (vide = notes générées par GitHub)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Publier comme préversion"
        required: true
        default: false
        type: boolean
      run_tests:
        description: "Exécuter les tests avant de publier"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: manual-release
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  CONFIGURATION: Release
  RUNTIME: win-x64
  SOLUTION: Anno1800IslandTool.sln
  APP_PROJECT: src/Anno1800IslandTool.UI/Anno1800IslandTool.UI.csproj
  TEST_PROJECT: tests/Anno1800IslandTool.Tests/Anno1800IslandTool.Tests.csproj
  PUBLISH_DIR: artifacts/publish/win-x64
  PACKAGE_DIR: artifacts/package

jobs:
  build-and-release:
    name: Build Windows x64 and publish the requested Release
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the selected revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate the requested tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG.Trim()

          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Le tag de Release est obligatoire."
          }

          if ($tag -notmatch '^[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Le tag contient un caractère non autorisé. Exemple accepté : v46.19"
          }

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore $env:SOLUTION

      - name: Build the software
        shell: pwsh
        run: dotnet build $env:SOLUTION --configuration $env:CONFIGURATION --no-restore

      - name: Run tests when requested
        if: inputs.run_tests
        shell: pwsh
        run: >-
          dotnet test $env:TEST_PROJECT
          --configuration $env:CONFIGURATION
          --no-build
          --no-restore
          --logger "trx;LogFileName=test-results.trx"

      - name: Publish the self-contained Windows application
        shell: pwsh
        run: >-
          dotnet publish $env:APP_PROJECT
          --configuration $env:CONFIGURATION
          --runtime $env:RUNTIME
          --self-contained true
          --output $env:PUBLISH_DIR
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create the ZIP package
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $env:RELEASE_TAG.Trim()
          $safeTag = $tag -replace '[^0-9A-Za-z._-]', '-'
          $zipName = "Anno1800IslandTool-$safeTag-win-x64.zip"
          $zipPath = Join-Path $env:PACKAGE_DIR $zipName

          New-Item -ItemType Directory -Path $env:PACKAGE_DIR -Force | Out-Null

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          Compress-Archive `
            -Path (Join-Path $env:PUBLISH_DIR '*') `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Le paquet ZIP n'a pas été créé."
          }

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Keep the ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Create the GitHub Release and attach the ZIP
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $env:RELEASE_TAG.Trim()
          $title = $env:RELEASE_NAME.Trim()
          if ([string]::IsNullOrWhiteSpace($title)) {
            $title = "Anno1800IslandTool $tag"
          }

          $releaseArgs = @(
            "release", "create", $tag, $env:ZIP_PATH,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", $title
          )

          if ($env:IS_PRERELEASE -eq "true") {
            $releaseArgs += "--prerelease"
          }

          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            $releaseArgs += "--generate-notes"
          }
          else {
            $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.txt"
            [System.IO.File]::WriteAllText($notesPath, $env:RELEASE_NOTES)
            $releaseArgs += @("--notes-file", $notesPath)
          }

          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            throw "La création de la Release GitHub a échoué. Vérifiez notamment que le tag n'est pas déjà utilisé."
          }
