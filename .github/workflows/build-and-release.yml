name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "V*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run tests before packaging"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

env:
  CONFIGURATION: Release
  PLATFORM: x64
  DOTNET_VERSION: "8.0.x"
  APP_PROJECT: src/Anno1800IslandTool.App/Anno1800IslandTool.App.csproj
  TEST_PROJECT: tests/Anno1800IslandTool.Tests/Anno1800IslandTool.Tests.csproj
  APP_FOLDER_NAME: Anno1800IslandTool
  ARTIFACTS_DIR: artifacts
  PUBLISH_DIR: artifacts/publish/win-x64

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        shell: pwsh
        run: dotnet restore -p:Platform=$env:PLATFORM

      - name: Build
        shell: pwsh
        run: dotnet build --configuration $env:CONFIGURATION --no-restore -p:Platform=$env:PLATFORM

      - name: Test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests == 'true'
        shell: pwsh
        run: >
          dotnet test $env:TEST_PROJECT
          --configuration $env:CONFIGURATION
          --no-build
          --no-restore
          -p:Platform=$env:PLATFORM
          --logger "trx;LogFileName=test-results.trx"

      - name: Publish application
        shell: pwsh
        run: >
          dotnet publish $env:APP_PROJECT
          --configuration $env:CONFIGURATION
          --runtime win-x64
          --self-contained true
          --output $env:PUBLISH_DIR
          -p:Platform=$env:PLATFORM
          -p:PublishSingleFile=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Prepare release folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseRoot = Join-Path $env:ARTIFACTS_DIR "release"
          $appFolder = Join-Path $releaseRoot $env:APP_FOLDER_NAME

          if (Test-Path $releaseRoot) {
            Remove-Item $releaseRoot -Recurse -Force
          }

          New-Item -ItemType Directory -Path $appFolder -Force | Out-Null

          Copy-Item -Path "$env:PUBLISH_DIR\*" -Destination $appFolder -Recurse -Force

      - name: Create ZIP archives
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "dev-${{ github.sha }}"
          }

          $releaseRoot = Join-Path $env:ARTIFACTS_DIR "release"
          $appZip = Join-Path $env:ARTIFACTS_DIR "Anno1800IslandTool-$version-win-x64.zip"
          $sourcesZip = Join-Path $env:ARTIFACTS_DIR "Anno1800IslandTool-$version-sources.zip"

          if (Test-Path $appZip) {
            Remove-Item $appZip -Force
          }

          if (Test-Path $sourcesZip) {
            Remove-Item $sourcesZip -Force
          }

          Compress-Archive `
            -Path (Join-Path $releaseRoot $env:APP_FOLDER_NAME) `
            -DestinationPath $appZip `
            -Force

          $sourceTemp = Join-Path $env:ARTIFACTS_DIR "sources"
          $sourceFolder = Join-Path $sourceTemp "Anno1800IslandTool-sources"

          if (Test-Path $sourceTemp) {
            Remove-Item $sourceTemp -Recurse -Force
          }

          New-Item -ItemType Directory -Path $sourceFolder -Force | Out-Null

          $excluded = @(
            ".git",
            ".vs",
            "bin",
            "obj",
            "artifacts",
            "TestResults",
            ".github\workflows\*.tmp"
          )

          Get-ChildItem -Path . -Force | ForEach-Object {
            $name = $_.Name

            if ($name -in @(".git", ".vs", "bin", "obj", "artifacts", "TestResults")) {
              return
            }

            Copy-Item -Path $_.FullName -Destination $sourceFolder -Recurse -Force
          }

          Compress-Archive `
            -Path $sourceFolder `
            -DestinationPath $sourcesZip `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Anno1800IslandTool-win-x64
          path: artifacts/*-win-x64.zip
          if-no-files-found: error

      - name: Upload sources artifact
        uses: actions/upload-artifact@v6
        with:
          name: Anno1800IslandTool-sources
          path: artifacts/*-sources.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Anno1800IslandTool ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            artifacts/*-win-x64.zip
            artifacts/*-sources.zip
